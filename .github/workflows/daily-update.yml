name: Daily price update

# 只在「所有市場皆已收盤」的時段執行，確保抓到的是收盤價而非盤中價：
#   UTC 22:00（台灣 06:00 隔日）— 美股剛收盤後，亞股早已收盤 → 供台灣 08:00 晨報使用
#   UTC 12:00（台灣 20:00）       — 美股尚未開盤、亞股當日已收盤 → 供台灣 20:00 晚報使用
# 註：腳本本身亦會剔除盤中未收盤 K 棒，雙重保險。
on:
  schedule:
    - cron: "0 12,22 * * *"
  workflow_dispatch: {}   # 允許手動觸發
  push:
    branches: [ main ]    # 首次推送即產生資料
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest prices
        run: python scripts/update_prices.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: daily price update ($(date -u +%Y-%m-%d' '%H:%M' UTC'))"
            git push
          fi
