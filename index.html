<html lang="zh-Hant">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>美股記憶體 / AI 硬體追蹤 — 歷史報告索引</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de;
    --text: #1f2328; --muted: #57606a; --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 40px; }
  .title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 18px; }
  .title h1 { font-size: 26px; margin: 0; }
  .title .tag { background: #ddf4ff; color: #0969da; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }

  /* 其他市場切換（與台股頁一致） */
  .markets { margin: 0 0 18px; }
  .markets .lbl { display: block; font-size: 12px; color: #64748b; font-weight: 400; margin: 0 0 6px; }
  .markets .mkt-row { display: flex; gap: 6px; max-width: 400px; }
  .markets a {
    flex: 1; text-align: center; padding: 7px 0; border-radius: 7px;
    font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid;
    transition: filter .12s, box-shadow .12s;
  }
  .markets a:hover { filter: brightness(.97); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .markets a.m-us { color: #1d4ed8; background: #eff4ff; border-color: #bfd3fe; }
  .markets a.m-tw { color: #15803d; background: #f0fdf4; border-color: #bbf7d0; }
  .markets a.m-cn { color: #b91c1c; background: #fff5f5; border-color: #fecaca; }

  /* 歷史報告：週一到週五不同顏色 */
  .row .datebadge.wd-1 { background: #ddf4ff; color: #0969da; } /* 週一 藍 */
  .row .datebadge.wd-2 { background: #dafbe1; color: #1a7f37; } /* 週二 綠 */
  .row .datebadge.wd-3 { background: #fff1d6; color: #bc4c00; } /* 週三 橘 */
  .row .datebadge.wd-4 { background: #f3eafd; color: #8250df; } /* 週四 紫 */
  .row .datebadge.wd-5 { background: #ffe6ea; color: #cf222e; } /* 週五 紅 */
  .row .datebadge.wd-6 { background: #d8f3f0; color: #137a6e; } /* 週六 青 */
  .row .datebadge.wd-0 { background: #eef1f4; color: #57606a; } /* 週日 灰 */

  .note { background: #eef6ff; border-left: 4px solid var(--accent); color: #24405e; font-size: 14px; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }

  /* 最新一期卡片 */
  .latest {
    display: block; text-decoration: none; color: inherit;
    background: linear-gradient(135deg, #fff7ed 0%, #fffdf8 60%);
    border: 1px solid #f3d9b5; border-radius: 14px; padding: 22px 24px; margin-bottom: 28px;
    transition: box-shadow .15s, transform .15s;
  }
  .latest:hover { box-shadow: 0 6px 20px rgba(188,76,0,.12); transform: translateY(-1px); }
  .latest .pill { display: inline-block; background: #fb8500; color: #fff; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
  .latest .date { font-size: 22px; font-weight: 800; margin: 12px 0 6px; color: #bc4c00; }
  .latest .head { color: #1f2328; font-size: 15px; font-weight: 600; }
  .latest .go { color: #bc4c00; font-size: 13px; margin-top: 10px; font-weight: 600; }

  .section-h { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; margin: 8px 2px 12px; }

  .list { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 14px; padding: 16px 18px;
    text-decoration: none; color: inherit; border-bottom: 1px solid #eaeef2;
    transition: background .12s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #f6f8fa; }
  .row .datebadge {
    flex: 0 0 auto; min-width: 92px; text-align: center;
    background: #f3eafd; color: #8250df; font-weight: 700; font-size: 13px;
    padding: 6px 8px; border-radius: 8px; font-variant-numeric: tabular-nums;
  }
  .row .rhead { flex: 1 1 auto; font-size: 15px; }
  .row .chev { flex: 0 0 auto; color: var(--muted); font-size: 18px; }
  .row.empty { color: var(--muted); font-style: italic; justify-content: center; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 16px; }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 640px) {
    main { padding: 18px 12px 30px; }
    .title h1 { font-size: 21px; }
    .latest .date { font-size: 19px; }
    .row .datebadge { min-width: 78px; font-size: 12px; }
    .row .rhead { font-size: 14px; }
  }
</style>
</head>
<body>
<main>
  <div class="title">
    <h1>📈 美股記憶體 / AI 硬體追蹤</h1>
    <span class="tag">每日 08:00</span>
  </div>
  <nav class="markets">
    <span class="lbl">看其他市場 →</span>
    <div class="mkt-row">
      <a class="m-us" href="https://hh2119-hash.github.io/us-stock-morning-report/">美股</a>
      <a class="m-tw" href="https://hh2119-hash.github.io/taiwan-stock-daily/">台股</a>
      <a class="m-cn" href="https://hh2119-hash.github.io/cn-stock-daily-report/">A股</a>
    </div>
  </nav>
  <div class="note">
    📅 報告於台灣時間每天 <b>08:00</b> 自動產出，每一期都保留「個股總覽 + 當日追蹤報告」完整版面。追蹤：MU · SNDK · DELL · ARM · MRVL · NVDA · TSM · ASX · Kioxia · Samsung · SK Hynix。
  </div>

  <a class="latest" id="latestCard" href="#">
    <span class="pill">最新</span>
    <div class="date" id="latestDate">載入中…</div>
    <div class="head" id="latestHead"></div>
    <div class="go">點此開啟最新一期 ➜</div>
  </a>

  <div class="section-h">📚 歷史報告</div>
  <div class="list" id="list">
    <div class="row empty">載入中…</div>
  </div>
</main>
<footer>
  資料僅供參考，非投資建議。股價由 GitHub Actions 每日自動更新。 &nbsp;|&nbsp;
  GitHub repo：<a href="https://github.com/hh2119-hash/us-memory-ai-tracker" target="_blank" rel="noopener">hh2119-hash/us-memory-ai-tracker</a>
</footer>

<script>
const REPO = "hh2119-hash/us-memory-ai-tracker";
const WD = ["日","一","二","三","四","五","六"];

function rkey(name){
  const m = name.replace(/\.md$/,"").match(/^(\d{4})-(\d{2})-(\d{2})(?:-(\d+))?$/);
  if(!m) return [0,0];
  return [Number(m[1]+m[2]+m[3]), m[4]?Number(m[4]):0];
}
function weekday(dstr){
  const d = new Date(dstr+"T00:00:00");
  return isNaN(d) ? "" : ("週"+WD[d.getDay()]);
}
function mmdd(dstr){ const p=dstr.split("-"); return p.length===3 ? (p[1]+"/"+p[2]) : dstr; }
function wdClass(dstr){ const d=new Date(dstr+"T00:00:00"); return isNaN(d) ? "" : (" wd-"+d.getDay()); }
function stripMd(s){
  return s.replace(/\*\*/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/[#>`_]/g,"").replace(/\s+/g," ").trim();
}
// 從報告 markdown 擷取一句標題（取「今日重點摘要」第一點，否則退回結論）
function headlineFrom(md){
  let i = md.indexOf("今日重點摘要");
  if(i>=0){
    const m = md.slice(i).match(/\n\s*1\.\s*(.+)/);
    if(m){ const h = stripMd(m[1]); if(h) return h.length>64 ? h.slice(0,64)+"…" : h; }
  }
  let j = md.indexOf("結論");
  if(j>=0){
    const seg = stripMd(md.slice(j).replace(/^[^\n]*\n/,""));
    const first = seg.split(/。/)[0];
    if(first) return (first.length>64 ? first.slice(0,64)+"…" : first) + "。";
  }
  return "每日記憶體 / AI 硬體追蹤報告";
}

async function build(){
  const listEl = document.getElementById("list");
  let files = [];
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/reports?_=`+Date.now());
    if(r.ok){
      const a = await r.json();
      files = a.filter(f => f.name.endsWith(".md") && f.name!=="latest.md")
               .map(f => f.name)
               .sort((x,y)=>{ const kx=rkey(x), ky=rkey(y); return (ky[0]-kx[0])||(ky[1]-kx[1]); });
    }
  }catch(e){ /* 靜默 */ }

  if(!files.length){
    // 後備：至少提供 latest
    document.getElementById("latestDate").textContent = "最新報告";
    document.getElementById("latestHead").textContent = "";
    document.getElementById("latestCard").href = "./report.html?d=latest";
    listEl.innerHTML = '<a class="row" href="./report.html?d=latest"><span class="datebadge">最新</span><span class="rhead">開啟最新報告</span><span class="chev">›</span></a>';
    return;
  }

  // 擷取每期標題
  const items = await Promise.all(files.map(async name=>{
    const base = name.replace(/\.md$/,"");
    const m = base.match(/^(\d{4}-\d{2}-\d{2})(?:-(\d+))?$/);
    const date = m ? m[1] : base;
    const seq  = (m && m[2]) ? `（第${m[2]}次）` : "";
    let head = "每日記憶體 / AI 硬體追蹤報告";
    try{ head = headlineFrom(await (await fetch("./reports/"+name+"?_="+Date.now())).text()); }catch(e){}
    return { base, date, seq, head };
  }));

  // 最新卡片
  const top = items[0];
  document.getElementById("latestDate").textContent = `${top.date}（${weekday(top.date)}）${top.seq} 報告`;
  document.getElementById("latestHead").textContent = top.head;
  document.getElementById("latestCard").href = `./report.html?d=${top.base}`;

  // 歷史清單
  listEl.innerHTML = "";
  items.forEach(it=>{
    const a = document.createElement("a");
    a.className = "row";
    a.href = `./report.html?d=${it.base}`;
    a.innerHTML =
      `<span class="datebadge${wdClass(it.date)}">${mmdd(it.date)} ${weekday(it.date)}</span>` +
      `<span class="rhead">${it.seq?`<b>${it.seq.replace(/[（）]/g,"")}</b> `:""}${it.head}</span>` +
      `<span class="chev">›</span>`;
    listEl.appendChild(a);
  });
}
build();
</script>
</body>
</html>
