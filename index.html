<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>美股記憶體 / AI 硬體追蹤儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de;
    --text: #1f2328; --muted: #57606a; --up: #1a7f37; --down: #cf222e;
    --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
    line-height: 1.6;
  }
  header { padding: 28px 20px 16px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header .meta { color: var(--muted); font-size: 13px; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h2 { border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 19px; }

  /* 個股總覽表格 */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.quote {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  table.quote th, table.quote td {
    padding: 11px 12px; text-align: right; white-space: nowrap;
    border-bottom: 1px solid #eaeef2; font-size: 14px;
  }
  table.quote thead th {
    background: #f0f3f6; color: var(--muted); font-weight: 600; font-size: 13px;
    position: sticky; top: 0;
  }
  table.quote td.name, table.quote th.name { text-align: left; font-weight: 600; }
  table.quote td.last { font-weight: 700; }
  table.quote tbody tr:last-child td { border-bottom: none; }
  table.quote tbody tr:hover { background: #f6f8fa; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

  /* 報告區：淺色文件風格 */
  #report {
    background: #fbfbfa; color: #1f2328; border: 1px solid var(--border);
    border-radius: 10px; padding: 32px 40px; max-width: 880px; margin: 0 auto;
    font-size: 16px; line-height: 1.85;
  }
  #report > *:first-child { margin-top: 0; }
  #report h1 { font-size: 26px; color: #111; border-bottom: 2px solid #e5e5e5; padding-bottom: 10px; margin: 32px 0 16px; }
  #report h2 { font-size: 21px; color: #111; border-bottom: 1px solid #ececec; padding-bottom: 6px; margin: 30px 0 14px; }
  #report h3 { font-size: 17px; color: #1f2328; border: none; margin: 22px 0 8px; }
  #report p { margin: 12px 0; }
  #report ul, #report ol { margin: 12px 0; padding-left: 24px; }
  #report li { margin: 6px 0; }
  #report a { color: #0969da; text-decoration: none; }
  #report a:hover { text-decoration: underline; }
  #report strong { color: #000; }
  #report code { background: #eff1f3; color: #b3261e; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  #report hr { border: none; border-top: 1px solid #e5e5e5; margin: 24px 0; }
  #report blockquote { border-left: 4px solid #d0d7de; margin: 16px 0; padding: 4px 16px; color: #57606a; background: #f6f8fa; }
  .pending { color: var(--muted); font-style: italic; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }

  @media (max-width: 640px) {
    header { padding: 16px 12px 10px; }
    header h1 { font-size: 18px; }
    header .meta { font-size: 12px; }
    main { padding: 10px; }
    table.quote th, table.quote td { padding: 9px 8px; font-size: 13px; }
    #report { padding: 18px 14px; max-width: 100%; font-size: 15px; line-height: 1.8; }
    #report h1 { font-size: 20px; } #report h2 { font-size: 17px; } #report h3 { font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <h1>📈 美股記憶體 / AI 硬體追蹤儀表板</h1>
  <div class="meta">
    追蹤：MU · SNDK · DELL · ARM · MRVL · AMD · INTC · AVGO · ASX · Kioxia · Samsung · SK Hynix
    &nbsp;|&nbsp; 股價更新：<span id="updated">載入中…</span>
  </div>
</header>
<main>
  <section>
    <h2>個股總覽</h2>
    <div class="table-wrap">
      <table class="quote">
        <thead>
          <tr>
            <th class="name">股票</th>
            <th>股價</th>
            <th>當日</th>
            <th>5日</th>
            <th>10日</th>
            <th>20日</th>
            <th>YTD</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td class="name pending" colspan="7">載入中…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>每日個股追蹤報告</h2>
    <div id="report"><span class="pending">載入最新報告中…</span></div>
  </section>
</main>
<footer>
  資料僅供參考，非投資建議。股價由 GitHub Actions 每日自動更新（台灣時間 08:00 / 20:00）。
</footer>

<script>
function fmtPrice(v) {
  if (v === null || v === undefined) return "—";
  return Number(v).toLocaleString(undefined, {maximumFractionDigits: 2});
}
function pctCell(v) {
  if (v === null || v === undefined) return '<td class="flat">—</td>';
  const cls = v > 0 ? "up" : (v < 0 ? "down" : "flat");
  const sign = v > 0 ? "+" : "";
  return `<td class="${cls}">${sign}${v}%</td>`;
}

async function loadPrices() {
  try {
    const res = await fetch("./data/prices.json?_=" + Date.now());
    const data = await res.json();
    document.getElementById("updated").textContent = data.updated_at_tw || data.updated_at_utc || "—";
    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    for (const [name, s] of Object.entries(data.stocks || {})) {
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td class="name">${name}</td>` +
        `<td class="last">${fmtPrice(s.last)}</td>` +
        pctCell(s.ret_1d) + pctCell(s.ret_5d) + pctCell(s.ret_10d) +
        pctCell(s.ret_20d) + pctCell(s.ret_ytd);
      rows.appendChild(tr);
    }
    if (!rows.children.length) {
      rows.innerHTML = '<tr><td class="name pending" colspan="7">尚無資料</td></tr>';
    }
  } catch (e) {
    document.getElementById("updated").textContent = "讀取失敗";
    document.getElementById("rows").innerHTML =
      '<tr><td class="name pending" colspan="7">讀取失敗</td></tr>';
  }
}

async function loadReport() {
  try {
    const res = await fetch("./reports/latest.md?_=" + Date.now());
    if (!res.ok) throw new Error("no report");
    document.getElementById("report").innerHTML = marked.parse(await res.text());
  } catch (e) {
    document.getElementById("report").innerHTML =
      '<span class="pending">目前沒有可顯示的報告。</span>';
  }
}

loadPrices();
loadReport();
</script>
</body>
</html>
